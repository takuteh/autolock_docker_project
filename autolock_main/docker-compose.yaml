version: "3"

services:
  autolock: # サービスの名前
    container_name: autolock_main
    build:
      context: . # Dockerfileが存在するディレクトリを指定
      dockerfile: Dockerfile # 使用するDockerfileを指定
    image: autolock_main_img
    privileged: true # 特権モードを有効にする
    volumes:
      - ../config/autolock_setting.json:/home/pi/autolock/gear_version/etc/autolock_setting.json:ro
      - ../config/authorize_db_setting.json:/home/pi/autolock/gear_version/etc/authorize_db_setting.json:ro
    networks:
      - autolock_net
    restart: always

networks:
  autolock_net:
    external: true
