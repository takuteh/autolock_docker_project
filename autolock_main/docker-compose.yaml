version: "3"

services:
  autolock: # サービスの名前
    container_name: autolock_main
    build:
      context: . # Dockerfileが存在するディレクトリを指定
      dockerfile: Dockerfile # 使用するDockerfileを指定
    image: autolock_main_img
    volumes:
      - ../config/autolock_setting.json:/home/app/autolock/gear_version/etc/autolock_setting.json:rw
    environment:
      MARIADB_HOST: autolock_auth_db
      MARIADB_PORT: "3306"
      MARIADB_USER: pi
      MARIADB_PASSWORD: raspberry
      MARIADB_DATABASE: autolock_user
      MARIADB_TABLE: users
      PIGPIO_HOST: 10.0.0.235
    networks:
      - autolock_net
    restart: always

networks:
  autolock_net:
#    external: true
